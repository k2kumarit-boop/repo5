    s.sort(function(a,c){return (c.cat===curP.cat)-(a.cat===curP.cat)});body='<div class="grid">'+s.slice(0,2).map(card).join('')+'</div>'}
  if(b.t==='index')body='<div class="tools rv"><input id="q" type="search" placeholder="Search essays" aria-label="Search essays"><div class="chips" id="chips">'+
    cats().map(function(c,j){return '<button type="button" class="chip'+(j?'':' on')+'" data-c="'+c+'">'+c+'</button>'}).join('')+'</div></div><div class="grid" id="pgrid">'+posts().map(card).join('')+'</div><p class="empty" id="empty" hidden>No essays match your search.</p>';
  if(b.t==='cols')body='<div class="grid">'+b.i.map(function(c,j){return '<div class="card glass rv" style="--i:'+j+'"><div class="tx"><h3>'+c[0]+'</h3><p>'+c[1]+'</p></div></div>'}).join('')+'</div>';
  if(b.t==='article'){var k=0;return '<section class="wrap">'+cover(curP,true)+'<article class="read glass rv">'+b.p.map(function(s,n){
    var o=s.indexOf('## ')===0?'<h2 id="h'+(k++)+'">'+esc(s.slice(3))+'</h2>':'<p>'+esc(s)+'</p>';
    return o+(n===2&&curP.q?'<blockquote>'+esc(curP.q)+'</blockquote>':'')}).join('')+'</article>'+
    '<div class="author glass rv"><span class="av">K</span><div><b>k2kumarit-boop</b><span>Writes short essays on reading, writing, design, and thinking.</span></div><a class="btn" href="https://github.com/k2kumarit-boop">Follow on GitHub</a></div></section>'}
  if(b.t==='follow')return '<section class="wrap sec"><div class="follow glass rv"><h2>Follow along</h2><p>New essays are announced on GitHub.</p><div class="btns"><a class="btn" href="https://github.com/k2kumarit-boop">Follow on GitHub</a></div></div></section>';
  if(b.t==='link')body='<div class="btns"><a class="btn rv" href="'+b.i[1]+'">'+b.i[0]+'</a></div>';
  return '<section class="wrap sec">'+h+body+'</section>';
}
function bindFilter(){
  var q=document.getElementById('q');if(!q)return;var cat='All';
  function run(){var t=q.value.trim().toLowerCase(),n=0;
    document.querySelectorAll('#pgrid .card').forEach(function(c){var ok=(cat==='All'||c.dataset.c===cat)&&(!t||c.dataset.t.indexOf(t)>-1);c.style.display=ok?'':'none';if(ok)n++});
    document.getElementById('empty').hidden=n>0}
  q.addEventListener('input',run);
  document.getElementById('chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;
    document.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x===b)});run()});
}
function render(){
  var id=location.hash.slice(1),i=P.findIndex(function(p){return p.id===id});
  if(i<0)i=0;var p=P[i];curP=p;
  document.title=p.n+' · Marginalia';
  var words=p.h.split(' ').map(function(w,j){return '<span class="w" style="--i:'+j+'">'+w+'</span>'}).join(' ');
  var meta=p.cat?p.cat+' · '+p.m+' read · '+p.d+' · By k2kumarit-boop':p.l;
  var h=i===0?'<section class="wrap hero"><div class="hw glass" id="heroIn"><h1>'+words+'</h1><p class="lede">'+p.l+'</p><div class="btns"><a class="btn" href="#essays">Read the essays</a><a class="btn g" href="#about">About the blog</a></div></div></section>'
    :'<section class="wrap hero"><h1>'+words+'</h1><p class="lede">'+meta+'</p></section>';
  app.innerHTML='<div class="page">'+h+p.b.map(blk).join('')+'</div>';
  window.scrollTo({top:0,behavior:'auto'});
  hero=document.getElementById('heroIn');
  heads=[].slice.call(document.querySelectorAll('.read h2'));
  toc.innerHTML=heads.length?'<b>On this page</b>'+heads.map(function(x,j){return '<button type="button" data-j="'+j+'">'+x.textContent+'</button>'}).join(''):'';
  toc.classList.toggle('on',heads.length>0);tbs=[].slice.call(toc.querySelectorAll('button'));
  orn.dataset.post=p.cat?'1':'';orn.classList.remove('show');
  par=[].slice.call(document.querySelectorAll('[data-s]')).map(function(e){return [e,+e.dataset.s]});
  document.querySelectorAll('.tabs a').forEach(function(a){var on=a.dataset.id===(p.par||p.id);a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  cur=target=0;docH=document.documentElement.scrollHeight-window.innerHeight||1;observe();bindFilter();
}
function observe(){
  var els=document.querySelectorAll('.rv');if(io)io.disconnect();
  if('IntersectionObserver' in window){
    io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
    els.forEach(function(e){io.observe(e)});
  }else els.forEach(function(e){e.classList.add('in')});
}
toc.addEventListener('click',function(e){var b=e.target.closest('button');if(b)heads[+b.dataset.j].scrollIntoView({behavior:calm?'auto':'smooth',block:'start'})});
document.getElementById('top').addEventListener('click',function(){window.scrollTo({top:0,behavior:calm?'auto':'smooth'})});
copyB.addEventListener('click',function(){
  var u=location.href;
  function ok(){copyB.textContent='Copied';setTimeout(function(){copyB.textContent='Copy link'},1600)}
  function fb(){var t=document.createElement('textarea');t.value=u;document.body.appendChild(t);t.select();
    try{document.execCommand('copy');ok()}catch(e){copyB.textContent='Copy failed'}document.body.removeChild(t)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(ok,fb)}else fb();
});
document.addEventListener('pointermove',function(e){
  var g=e.target.closest&&e.target.closest('.glass');if(!g)return;
  var r=g.getBoundingClientRect();g.style.setProperty('--px',(e.clientX-r.left)+'px');g.style.setProperty('--py',(e.clientY-r.top)+'px');
});
function frame(){
  cur+=(target-cur)*(calm?1:.1);if(Math.abs(target-cur)<.05)cur=target;
  var q=cur/docH;bar.style.transform='scaleX('+(q<0?0:q>1?1:q)+')';
  for(var i=0;i<par.length;i++)par[i][0].style.transform='translate3d(0,'+(cur*par[i][1])+'px,0)';
  if(hero){var hp=Math.min(cur/(window.innerHeight*.9),1);hero.style.transform='translate3d(0,'+(-hp*40)+'px,0) scale('+(1-hp*.05)+')';hero.style.opacity=1-hp*.7}
  if(heads.length){var a=0;heads.forEach(function(x,j){if(x.getBoundingClientRect().top<window.innerHeight*.4)a=j});
    tbs.forEach(function(b,j){b.classList.toggle('on',j===a)})}
  requestAnimationFrame(frame);
}
function sc(){target=window.scrollY;orn.classList.toggle('show',!!orn.dataset.post&&target>260)}
window.addEventListener('scroll',sc,{passive:true});
window.addEventListener('resize',function(){docH=document.documentElement.scrollHeight-window.innerHeight||1});
window.addEventListener('load',function(){docH=document.documentElement.scrollHeight-window.innerHeight||1});
window.addEventListener('hashchange',render);
render();cur=target=window.scrollY;sc();frame();
})();
</script>
</body>
</html>
